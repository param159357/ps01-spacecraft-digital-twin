# PS01 deployment stack — CLAUDE.md section 14.
# One persistent host, one API process, one PostgreSQL instance with a named volume,
# Caddy serving the exported frontend and proxying /api including SSE.
#
# Stopping these containers must never delete stored data: the database lives in the
# named volume `ps01_pgdata`, which survives `docker compose down` (but not `down -v`).

name: ps01

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ps01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ps01_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ps01}
    volumes:
      - ps01_pgdata:/var/lib/postgresql/data
    # No public database port in deployment. The local-development port mapping below
    # is bound to loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ps01} -d ${POSTGRES_DB:-ps01}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ps01}:${POSTGRES_PASSWORD:-ps01_local_dev}@db:5432/${POSTGRES_DB:-ps01}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-1}
      FORECAST_INTERVAL_SECONDS: ${FORECAST_INTERVAL_SECONDS:-5}
      AI_ENABLED: ${AI_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_DAILY_CALL_LIMIT: ${LLM_DAILY_CALL_LIMIT:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      AI_INCIDENT_COOLDOWN_SECONDS: ${AI_INCIDENT_COOLDOWN_SECONDS:-120}
      ANOMALY_MODEL_PATH: ${ANOMALY_MODEL_PATH:-}
    # Exactly one Uvicorn worker owns the simulation loop. No autoreload, no replicas.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    command: >
      sh -c "test -f /srv/www/index.html &&
             exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/.next-export:/srv/www:ro
      - ps01_caddy_data:/data
      - ps01_caddy_config:/config

volumes:
  ps01_pgdata:
  ps01_caddy_data:
  ps01_caddy_config:
