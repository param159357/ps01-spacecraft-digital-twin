[project]
name = "ps01-backend"
version = "0.1.0"
description = "PS01 Spacecraft Digital Twin — backend API, simulation and analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "pyyaml==6.0.3",
    "numpy==2.5.3",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    # Starlette's TestClient warns that httpx 0.x is deprecated and asks for httpx2.
    "httpx2==2.13.0",
    "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency injection is expressed as `= Depends(...)` in the signature.
    # That is the framework's documented idiom, not an accidental mutable default.
    "B008",
    # `class X(str, Enum)` is deliberate: it is explicit about the mixin and behaves
    # identically to StrEnum for Pydantic serialization and JSON output.
    "UP042",
]
