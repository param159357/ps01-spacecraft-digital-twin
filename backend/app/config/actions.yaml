# PS01 allowed action catalogue — CLAUDE.md section 9.2.
#
# Actions are predefined code with modelled consequences. They are NEVER executable
# text generated by an LLM. `enabled: false` means the action is declared but has no
# implementation or tests yet, so it MUST NOT be offered to an operator as an
# available fix.

config_version: "actions-0.2.0"

defaults:
  proposal_ttl_s: 30           # section 9.3 suggested TTL
  executor_role: MASTER        # only the master executes recovery

actions:
  - id: REDUCE_PAYLOAD_POWER
    label: Reduce payload duty
    enabled: true
    phase: 3
    subsystem: POWER
    operation: Select an allowed payload duty level.
    arguments:
      duty_percent:
        type: enum
        allowed: [0, 50, 100]
    prerequisites:
      - Payload is nonessential in the current mode.
    trade_off: Reducing payload duty delays configured mission work.

  - id: POSTPONE_PAYLOAD_TASK
    label: Postpone payload task
    enabled: false
    phase: null
    subsystem: POWER
    operation: Shift a nonessential scheduled task to a selected allowed slot.
    arguments:
      task_id: { type: string }
      target_slot: { type: string }
    prerequisites:
      - Task exists in the configured schedule.
      - Target slot lies inside the configured schedule.
    trade_off: Records the delayed or lost operation.

  - id: SET_HEATER_AUTO
    label: Restore heater thermostat
    enabled: false
    phase: 5
    subsystem: THERMAL_PROPULSION
    operation: Restore commanded thermostat operation.
    arguments: {}
    prerequisites:
      - Actuator is controllable.
    trade_off: If the actuator ignores commands, the response may fail and must be reported.

  - id: ISOLATE_OPTIONAL_BRANCH
    label: Isolate optional branch
    enabled: false
    phase: 5
    subsystem: POWER
    operation: Open an independently modelled isolator on an optional load branch.
    arguments:
      branch_id:
        type: enum
        allowed: [OPTIONAL_A]
    prerequisites:
      - Isolation hardware exists for the selected branch in the toy configuration.
      - Essential power can never be isolated.
    trade_off: >
      Removes the branch load and its heat input. Does not repair a failed component;
      software cannot un-break hardware.

  - id: ENTER_SAFE_MODE
    label: Enter safe mode
    enabled: false
    phase: null
    subsystem: MASTER
    operation: Apply the defined essential-load and heater policy.
    arguments: {}
    prerequisites:
      - Safe-mode policy fully defined in configuration.
      - Essential radio, computer and temperature constraints preserved.
    trade_off: Suspends all optional mission activity until the mode is left.
